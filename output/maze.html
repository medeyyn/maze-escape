const M = 14;

const key = (a, b) => Math.min(a, b) * N + Math.max(a, b);

const wallOf = new Map();

const cx = c => M + (c % C) * S + S / 2, cy = c => M + Math.floor(c / C) * S + S / 2;
function seg(k) {
  const a = Math.min(D.a[k], D.b[k]), b = Math.max(D.a[k], D.b[k]);

function step(dr, dc) {
  if (done) return;

});
